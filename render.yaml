services:
  - type: web
    name: mbote-room-api
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: mbote-room-db
          property: connectionString
      - key: ADMIN_EMAILS
        sync: false
      - key: MBOTE_AUTH_BASE_URL
        value: https://mbote-backend.onrender.com
      - key: MBOTE_AUTH_CLIENT_ID
        value: mbote-room
      - key: MBOTE_AUTH_CLIENT_SECRET
        sync: false
      - key: MBOTE_AUTH_PROFILE_URL
        value: https://mbote-backend.onrender.com/api/users/me
      - key: MBOTE_AUTH_REDIRECT_URI
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.1-8b-instant
      - key: GROQ_TIMEOUT_MS
        value: "30000"

databases:
  - name: mbote-room-db
    plan: free
