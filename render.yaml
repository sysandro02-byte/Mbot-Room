services:
  - type: web
    name: mbote-room-api
    runtime: node
    plan: free
    autoDeployTrigger: checksPass
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22.22.0"
      - key: NODE_OPTIONS
        value: "--max-old-space-size=192"
      - key: MBOTE_ROOM_REQUIRE_CI_GATE
        value: "true"
      - key: MBOTE_ROOM_GITHUB_REPOSITORY
        value: sysandro02-byte/Mbot-Room
      - key: MBOTE_ROOM_REQUIRED_WORKFLOW
        value: MBoteRoom CI
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_MODE
        value: postgres
      - key: ADMIN_EMAILS
        sync: false
      - key: MBOTE_ROOM_APP_URL
        value: https://mbote-room.vercel.app
      - key: MBOTE_ROOM_ALLOWED_ORIGINS
        value: https://mbote-room-api.onrender.com,https://mbote-room.vercel.app,https://mboteroom.loukatech.com
      - key: MBOTE_ROOM_ALLOWED_ORIGIN_PATTERNS
        value: https://mbote-room-*.vercel.app
      - key: MBOTE_ROOM_SESSION_COOKIE
        value: mbote_room_session
      - key: MBOTE_ROOM_COOKIE_SAMESITE
        value: lax
      - key: MBOTE_AUTH_BASE_URL
        value: https://mbote-backend.onrender.com
      - key: MBOTE_AUTH_CLIENT_ID
        value: mbote-room
      - key: MBOTE_AUTH_CLIENT_SECRET
        sync: false
      - key: MBOTE_AUTH_PROFILE_URL
        value: https://mbote-backend.onrender.com/api/users/me
      - key: MBOTE_AUTH_REDIRECT_URI
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: qwen/qwen3.8-27b,openai/gpt-oss-120b,openai/gpt-oss-20b
      - key: GROQ_TIMEOUT_MS
        value: "30000"
      - key: GROQ_TRANSCRIPTION_MODEL
        value: whisper-large-v3-turbo
      - key: GROQ_TRANSCRIPTION_TIMEOUT_MS
        value: "30000"
      - key: CAPTION_CHUNK_SECONDS
        value: "10"
      - key: MBOTE_MAIL_RELAY_URL
        value: https://mbote-mobile-backend.onrender.com/api/v1/internal/mbote-room/email
      - key: MBOTE_ROOM_MAIL_SECRET
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_API_URL
        value: https://api.brevo.com/v3/smtp/email
      - key: BREVO_SENDER_EMAIL
        value: contacts@loukatech.com
      - key: BREVO_SENDER_NAME
        value: MBotéRoom
      - key: EMAIL_REPLY_TO
        value: nzotocare@gmail.com
      - key: RESEND_API_KEY
        sync: false
      - key: MEETING_INVITE_FROM
        sync: false
      - key: STUN_URLS
        value: stun:stun.l.google.com:19302,stun:stun1.l.google.com:19302
      - key: TURN_URLS
        sync: false
      - key: TURN_SHARED_SECRET
        sync: false
      - key: TURN_CREDENTIAL_TTL_SECONDS
        value: "3600"
      - key: MBOTEROOM_TURN_URL
        sync: false
      - key: MBOTEROOM_TURN_USERNAME
        sync: false
      - key: MBOTEROOM_TURN_CREDENTIAL
        sync: false
      - key: MEDIA_TRANSPORT
        value: auto
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      - key: LIVEKIT_TOKEN_TTL_SECONDS
        value: "900"
      - key: MBOTE_ROOM_REQUIRE_LIVEKIT
        value: "false"
      - key: MBOTE_ROOM_REQUIRE_SERVER_RECORDING
        value: "false"
      - key: LIVEKIT_EGRESS_ENABLED
        value: "false"
      - key: LIVEKIT_EGRESS_USE_SERVER_DEFAULT_STORAGE
        value: "false"
      - key: LIVEKIT_EGRESS_S3_BUCKET
        sync: false
      - key: LIVEKIT_EGRESS_S3_REGION
        sync: false
      - key: LIVEKIT_EGRESS_S3_ENDPOINT
        sync: false
      - key: LIVEKIT_EGRESS_S3_ACCESS_KEY
        sync: false
      - key: LIVEKIT_EGRESS_S3_SECRET_KEY
        sync: false
      - key: LIVEKIT_EGRESS_S3_FORCE_PATH_STYLE
        value: "true"
      - key: VITE_TURN_URLS
        sync: false
      - key: VITE_TURN_USERNAME
        sync: false
      - key: VITE_TURN_CREDENTIAL
        sync: false
