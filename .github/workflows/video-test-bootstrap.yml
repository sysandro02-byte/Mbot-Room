name: Bootstrap browser video test

on:
  push:
    branches: [codex/zoom-core-real-apis]

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mbote
          POSTGRES_PASSWORD: mbote
          POSTGRES_DB: mbote_room_video_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U mbote -d mbote_room_video_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgresql://mbote:mbote@127.0.0.1:5432/mbote_room_video_test
      PGSSLMODE: disable
      MBOTE_ROOM_TEST_DATABASE: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch verified video startup prerequisites
        run: |
          node --input-type=commonjs <<'NODE'
          const fs = require('fs');
          const path = 'src/pages/MeetingRoomV2.tsx';
          let source = fs.readFileSync(path, 'utf8');
          const replace = (from, to) => {
            if (source.includes(to)) return;
            if (!source.includes(from)) throw new Error(`Patch target not found: ${from.slice(0, 100)}`);
            source = source.replace(from, to);
          };

          replace(
            "  }, [stream]);",
            "  }, [stream, videoEnabled]);",
          );

          if (!source.includes('const [mediaReady, setMediaReady]')) {
            replace(
              "  const [localStream, setLocalStream] = useState<MediaStream | null>(null);\n  const [micEnabled, setMicEnabled] = useState(initialMic);",
              "  const [localStream, setLocalStream] = useState<MediaStream | null>(null);\n  const [mediaReady, setMediaReady] = useState(false);\n  const [micEnabled, setMicEnabled] = useState(initialMic);",
            );
            replace(
              "    enabled: Boolean(meeting?.id && localUserId && isAuthenticated),",
              "    enabled: Boolean(meeting?.id && localUserId && isAuthenticated && mediaReady),",
            );
            replace(
              "  useEffect(() => {\n    if (!navigator.mediaDevices?.getUserMedia) {\n      setNotice('Votre navigateur ne permet pas l’accès à la caméra ou au microphone.');\n      return;\n    }",
              "  useEffect(() => {\n    setMediaReady(false);\n    if (!navigator.mediaDevices?.getUserMedia) {\n      setNotice('Votre navigateur ne permet pas l’accès à la caméra ou au microphone.');\n      setMediaReady(true);\n      return;\n    }",
            );
            replace(
              "        cameraStreamRef.current = stream;\n        setLocalStream(stream);",
              "        cameraStreamRef.current = stream;\n        setLocalStream(stream);\n        setMediaReady(true);",
            );
            replace(
              "          : 'Caméra ou microphone indisponible. Vous pouvez rester dans la réunion sans média local.');\n      }",
              "          : 'Caméra ou microphone indisponible. Vous pouvez rester dans la réunion sans média local.');\n        if (!cancelled) setMediaReady(true);\n      }",
            );
          }
          fs.writeFileSync(path, source);
          NODE
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install current dependencies
        run: npm ci
      - name: Add Playwright test dependency
        run: npm install --save-dev @playwright/test
      - name: Dependency audit
        run: npm audit --audit-level=high
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Typecheck
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Two-browser video meeting test
        run: node scripts/test-video-meeting.mjs
      - name: Commit verified browser test dependencies and page fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json src/pages/MeetingRoomV2.tsx
          if git diff --cached --quiet; then
            echo "Verified changes already committed."
            exit 0
          fi
          git commit -m "test: persist verified video meeting prerequisites"
          git push origin HEAD:codex/zoom-core-real-apis
