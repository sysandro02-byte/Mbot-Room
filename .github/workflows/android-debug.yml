name: MBoteRoom Android Debug APK

on:
  pull_request:
    branches: [main]
    paths:
      - "android/**"
      - "src/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/android-debug.yml"

permissions:
  contents: read

concurrency:
  group: mboteroom-android-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install web dependencies
        run: npm ci

      - name: Build offline web shell for Android
        env:
          MBOTEROOM_ANDROID_BUILD: "true"
          VITE_API_URL: https://mbote-room-api.onrender.com
          VITE_SOCKET_URL: https://mbote-room-api.onrender.com
        run: |
          npm run build:frontend
          rm -rf android/app/src/main/assets
          mkdir -p android/app/src/main/assets
          cp -a dist/. android/app/src/main/assets/
          test -s android/app/src/main/assets/index.html
          test -d android/app/src/main/assets/assets

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Assemble debug APK
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify bundled offline shell
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -l "$APK" | grep -F "assets/index.html"
          unzip -l "$APK" | grep -E "assets/assets/.+\.js"
          unzip -l "$APK" | grep -F "assets/icons/"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mboteroom-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
