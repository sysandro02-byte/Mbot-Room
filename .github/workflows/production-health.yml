name: MBoteRoom Production Health

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - MBoteRoom CI
    types:
      - completed
    branches:
      - main
  schedule:
    - cron: '*/30 * * * *'

permissions:
  contents: read

jobs:
  health:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Check production availability
        run: node scripts/check-production-health.mjs
