name: Refresh secure lockfile

on:
  push:
    branches: [codex/zoom-core-real-apis]

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install current lock
        run: npm ci
      - name: Refresh vulnerable transitive dependencies
        run: npm audit fix --package-lock-only
      - name: Ensure manifest was not rewritten
        run: git diff --exit-code -- package.json
      - name: Reinstall refreshed lock
        run: npm ci
      - name: Require no high dependency vulnerabilities
        run: npm audit --audit-level=high
      - name: Typecheck
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Commit secure lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already secure."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: refresh secure dependency lockfile"
          git push origin HEAD:codex/zoom-core-real-apis
