name: MBoteRoom Android APK

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: mboteroom-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install web dependencies
        run: npm ci

      - name: Build bundled offline application shell
        env:
          MBOTEROOM_ANDROID_BUILD: "true"
          VITE_API_URL: https://mbote-room-api.onrender.com
          VITE_SOCKET_URL: https://mbote-room-api.onrender.com
        run: |
          npm run build:frontend
          rm -rf android/app/src/main/assets
          mkdir -p android/app/src/main/assets
          cp -a dist/. android/app/src/main/assets/
          test -s android/app/src/main/assets/index.html
          test -d android/app/src/main/assets/assets

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Compile Android wrapper
        working-directory: android
        run: gradle --no-daemon :app:compileDebugJavaWithJavac

      - name: Validate Android release signing
        env:
          KEYSTORE_B64: ${{ secrets.MBOTEROOM_ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.MBOTEROOM_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MBOTEROOM_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MBOTEROOM_ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "::error::Secret MBOTEROOM_ANDROID_KEYSTORE_BASE64 manquant."; exit 1; }
          test -n "$STORE_PASSWORD" || { echo "::error::Secret MBOTEROOM_ANDROID_KEYSTORE_PASSWORD manquant."; exit 1; }
          test -n "$KEY_ALIAS" || { echo "::error::Secret MBOTEROOM_ANDROID_KEY_ALIAS manquant."; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "::error::Secret MBOTEROOM_ANDROID_KEY_PASSWORD manquant."; exit 1; }

      - name: Restore release keystore
        env:
          KEYSTORE_B64: ${{ secrets.MBOTEROOM_ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_B64" | base64 --decode > android/app/mboteroom-release.jks
          test -s android/app/mboteroom-release.jks

      - name: Build signed release APK and AAB
        working-directory: android
        env:
          MBOTEROOM_KEYSTORE_FILE: mboteroom-release.jks
          MBOTEROOM_KEYSTORE_PASSWORD: ${{ secrets.MBOTEROOM_ANDROID_KEYSTORE_PASSWORD }}
          MBOTEROOM_KEY_ALIAS: ${{ secrets.MBOTEROOM_ANDROID_KEY_ALIAS }}
          MBOTEROOM_KEY_PASSWORD: ${{ secrets.MBOTEROOM_ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease :app:bundleRelease

      - name: Verify bundled offline shell
        run: |
          unzip -l android/app/build/outputs/apk/release/app-release.apk | grep -F "assets/index.html"
          unzip -l android/app/build/outputs/apk/release/app-release.apk | grep -E "assets/assets/.+\.js"
          unzip -l android/app/build/outputs/apk/release/app-release.apk | grep -F "assets/icons/"

      - name: Verify APK alignment and signature
        run: |
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          APKSIGNER="$BUILD_TOOLS/apksigner"
          ZIPALIGN="$BUILD_TOOLS/zipalign"
          test -x "$APKSIGNER" || { echo "::error::apksigner introuvable."; exit 1; }
          test -x "$ZIPALIGN" || { echo "::error::zipalign introuvable."; exit 1; }
          "$ZIPALIGN" -c -v 4 android/app/build/outputs/apk/release/app-release.apk
          "$APKSIGNER" verify --verbose --print-certs android/app/build/outputs/apk/release/app-release.apk

      - name: Prepare public Android packages
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk MBoteRoom-Android.apk
          cp android/app/build/outputs/bundle/release/app-release.aab MBoteRoom-Android.aab
          rm -f android/app/mboteroom-release.jks

      - name: Create release checksums
        run: sha256sum MBoteRoom-Android.apk MBoteRoom-Android.aab > MBoteRoom-Android.sha256

      - name: Upload signed APK artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: mboteroom-android-release
          path: |
            MBoteRoom-Android.apk
            MBoteRoom-Android.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Upload Play Store bundle
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: mboteroom-android-play-bundle
          path: MBoteRoom-Android.aab
          if-no-files-found: error
          retention-days: 30

      - name: Request Supabase publish tickets with GitHub OIDC
        env:
          SUPABASE_PUBLISH_FUNCTION: https://jyaqdzkkxvrxxrseqyhy.supabase.co/functions/v1/mboteroom-android-publish
        run: |
          OIDC_RESPONSE="$(curl --fail-with-body --silent --show-error --retry 3 \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=mboteroom-supabase-storage")"
          OIDC_TOKEN="$(printf '%s' "$OIDC_RESPONSE" | jq -r '.value // empty')"
          test -n "$OIDC_TOKEN" || { echo "::error::GitHub OIDC token introuvable."; exit 1; }

          curl --fail-with-body --silent --show-error --retry 3 \
            -X POST "$SUPABASE_PUBLISH_FUNCTION" \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            -H "Content-Type: application/json" \
            --data "{}" \
            > /tmp/mboteroom-supabase-publish.json

          jq -e '.bucket == "mboteroom-releases"' /tmp/mboteroom-supabase-publish.json >/dev/null
          jq -e --arg sha "$GITHUB_SHA" '.sha == $sha' /tmp/mboteroom-supabase-publish.json >/dev/null
          for item in apk aab checksum manifest; do
            jq -e --arg item "$item" '.uploads[$item].signedUrl | strings | length > 20' /tmp/mboteroom-supabase-publish.json >/dev/null
          done

      - name: Publish Android packages to LoukaTech Supabase Storage
        run: |
          APK_UPLOAD_URL="$(jq -r '.uploads.apk.signedUrl' /tmp/mboteroom-supabase-publish.json)"
          AAB_UPLOAD_URL="$(jq -r '.uploads.aab.signedUrl' /tmp/mboteroom-supabase-publish.json)"
          CHECKSUM_UPLOAD_URL="$(jq -r '.uploads.checksum.signedUrl' /tmp/mboteroom-supabase-publish.json)"
          MANIFEST_UPLOAD_URL="$(jq -r '.uploads.manifest.signedUrl' /tmp/mboteroom-supabase-publish.json)"

          curl --fail-with-body --silent --show-error --retry 3 -X PUT \
            -H "Content-Type: application/vnd.android.package-archive" \
            -H "Cache-Control: max-age=31536000, immutable" \
            --data-binary @MBoteRoom-Android.apk "$APK_UPLOAD_URL"

          curl --fail-with-body --silent --show-error --retry 3 -X PUT \
            -H "Content-Type: application/octet-stream" \
            -H "Cache-Control: max-age=31536000, immutable" \
            --data-binary @MBoteRoom-Android.aab "$AAB_UPLOAD_URL"

          curl --fail-with-body --silent --show-error --retry 3 -X PUT \
            -H "Content-Type: text/plain" \
            -H "Cache-Control: max-age=31536000, immutable" \
            --data-binary @MBoteRoom-Android.sha256 "$CHECKSUM_UPLOAD_URL"

          APK_SHA="$(sha256sum MBoteRoom-Android.apk | awk '{print $1}')"
          AAB_SHA="$(sha256sum MBoteRoom-Android.aab | awk '{print $1}')"
          APK_SIZE="$(stat -c '%s' MBoteRoom-Android.apk)"
          AAB_SIZE="$(stat -c '%s' MBoteRoom-Android.aab)"
          APK_PATH="$(jq -r '.uploads.apk.path' /tmp/mboteroom-supabase-publish.json)"
          AAB_PATH="$(jq -r '.uploads.aab.path' /tmp/mboteroom-supabase-publish.json)"
          CHECKSUM_PATH="$(jq -r '.uploads.checksum.path' /tmp/mboteroom-supabase-publish.json)"
          APK_PUBLIC_URL="$(jq -r '.public.apkUrl' /tmp/mboteroom-supabase-publish.json)"
          AAB_PUBLIC_URL="$(jq -r '.public.aabUrl' /tmp/mboteroom-supabase-publish.json)"
          CHECKSUM_PUBLIC_URL="$(jq -r '.public.checksumUrl' /tmp/mboteroom-supabase-publish.json)"

          jq -n \
            --arg sha "$GITHUB_SHA" \
            --arg runNumber "$GITHUB_RUN_NUMBER" \
            --arg runAttempt "$GITHUB_RUN_ATTEMPT" \
            --arg publishedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg apkPath "$APK_PATH" \
            --arg apkUrl "$APK_PUBLIC_URL" \
            --arg apkSha "$APK_SHA" \
            --argjson apkSize "$APK_SIZE" \
            --arg aabPath "$AAB_PATH" \
            --arg aabUrl "$AAB_PUBLIC_URL" \
            --arg aabSha "$AAB_SHA" \
            --argjson aabSize "$AAB_SIZE" \
            --arg checksumPath "$CHECKSUM_PATH" \
            --arg checksumUrl "$CHECKSUM_PUBLIC_URL" \
            '{
              schemaVersion: 1,
              sha: $sha,
              runNumber: ($runNumber | tonumber),
              runAttempt: ($runAttempt | tonumber),
              publishedAt: $publishedAt,
              apk: { path: $apkPath, url: $apkUrl, sha256: $apkSha, sizeBytes: $apkSize },
              aab: { path: $aabPath, url: $aabUrl, sha256: $aabSha, sizeBytes: $aabSize },
              checksum: { path: $checksumPath, url: $checksumUrl }
            }' > /tmp/mboteroom-latest.json

          curl --fail-with-body --silent --show-error --retry 3 -X PUT \
            -H "Content-Type: application/json" \
            -H "Cache-Control: max-age=0, no-cache" \
            -H "x-upsert: true" \
            --data-binary @/tmp/mboteroom-latest.json "$MANIFEST_UPLOAD_URL"

      - name: Verify Supabase Android publication
        run: |
          LOCAL_SHA="$(sha256sum MBoteRoom-Android.apk | awk '{print $1}')"
          APK_URL="$(jq -r '.public.apkUrl' /tmp/mboteroom-supabase-publish.json)"
          MANIFEST_URL="$(jq -r '.public.manifestUrl' /tmp/mboteroom-supabase-publish.json)"

          curl --fail-with-body --silent --show-error --retry 5 \
            "${APK_URL}?v=${GITHUB_SHA}" -o /tmp/MBoteRoom-Android.apk
          REMOTE_SHA="$(sha256sum /tmp/MBoteRoom-Android.apk | awk '{print $1}')"
          test "$REMOTE_SHA" = "$LOCAL_SHA" || {
            echo "::error::L'APK stocké dans Supabase ne correspond pas au build courant."
            exit 1
          }

          curl --fail-with-body --silent --show-error --retry 5 \
            -H "Cache-Control: no-cache" "${MANIFEST_URL}?v=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            -o /tmp/mboteroom-latest-remote.json

          jq -e --arg sha "$GITHUB_SHA" --arg digest "$LOCAL_SHA" \
            '.sha == $sha and .apk.sha256 == $digest and (.apk.path | startswith("android/builds/" + $sha + "/"))' \
            /tmp/mboteroom-latest-remote.json >/dev/null

          echo "APK MBotéRoom publié et vérifié dans Supabase Storage pour ${GITHUB_SHA}."
