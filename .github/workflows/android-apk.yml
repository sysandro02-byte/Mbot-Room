name: MBoteRoom Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mboteroom-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug

      - name: Prepare public APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk MBoteRoom-Android.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mboteroom-android-debug
          path: MBoteRoom-Android.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish stable Android download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view android-latest >/dev/null 2>&1; then
            gh release upload android-latest MBoteRoom-Android.apk --clobber
            gh release edit android-latest \
              --title "MBotéRoom Android — dernière version" \
              --notes "APK Android généré automatiquement depuis la branche main. Commit: ${GITHUB_SHA}."
          else
            gh release create android-latest MBoteRoom-Android.apk \
              --target "${GITHUB_SHA}" \
              --title "MBotéRoom Android — dernière version" \
              --notes "APK Android généré automatiquement depuis la branche main. Commit: ${GITHUB_SHA}."
          fi
