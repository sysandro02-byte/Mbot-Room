name: MBoteRoom Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mboteroom-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install web dependencies
        run: npm ci

      - name: Build bundled offline application shell
        env:
          MBOTEROOM_ANDROID_BUILD: "true"
          VITE_API_URL: https://mbote-room-api.onrender.com
          VITE_SOCKET_URL: https://mbote-room-api.onrender.com
        run: |
          npm run build:frontend
          rm -rf android/app/src/main/assets
          mkdir -p android/app/src/main/assets
          cp -a dist/. android/app/src/main/assets/
          test -s android/app/src/main/assets/index.html
          test -d android/app/src/main/assets/assets

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Compile Android wrapper
        working-directory: android
        run: gradle --no-daemon :app:compileDebugJavaWithJavac

      - name: Validate Android release signing
        env:
          KEYSTORE_B64: ${{ secrets.MBOTEROOM_ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.MBOTEROOM_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MBOTEROOM_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MBOTEROOM_ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "::error::Secret MBOTEROOM_ANDROID_KEYSTORE_BASE64 manquant."; exit 1; }
          test -n "$STORE_PASSWORD" || { echo "::error::Secret MBOTEROOM_ANDROID_KEYSTORE_PASSWORD manquant."; exit 1; }
          test -n "$KEY_ALIAS" || { echo "::error::Secret MBOTEROOM_ANDROID_KEY_ALIAS manquant."; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "::error::Secret MBOTEROOM_ANDROID_KEY_PASSWORD manquant."; exit 1; }

      - name: Restore release keystore
        env:
          KEYSTORE_B64: ${{ secrets.MBOTEROOM_ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_B64" | base64 --decode > android/app/mboteroom-release.jks
          test -s android/app/mboteroom-release.jks

      - name: Build signed release APK and AAB
        working-directory: android
        env:
          MBOTEROOM_KEYSTORE_FILE: mboteroom-release.jks
          MBOTEROOM_KEYSTORE_PASSWORD: ${{ secrets.MBOTEROOM_ANDROID_KEYSTORE_PASSWORD }}
          MBOTEROOM_KEY_ALIAS: ${{ secrets.MBOTEROOM_ANDROID_KEY_ALIAS }}
          MBOTEROOM_KEY_PASSWORD: ${{ secrets.MBOTEROOM_ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease :app:bundleRelease

      - name: Verify APK alignment and signature
        run: |
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          APKSIGNER="$BUILD_TOOLS/apksigner"
          ZIPALIGN="$BUILD_TOOLS/zipalign"
          test -x "$APKSIGNER" || { echo "::error::apksigner introuvable."; exit 1; }
          test -x "$ZIPALIGN" || { echo "::error::zipalign introuvable."; exit 1; }
          "$ZIPALIGN" -c -v 4 android/app/build/outputs/apk/release/app-release.apk
          "$APKSIGNER" verify --verbose --print-certs android/app/build/outputs/apk/release/app-release.apk

      - name: Prepare public Android packages
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk MBoteRoom-Android.apk
          cp android/app/build/outputs/bundle/release/app-release.aab MBoteRoom-Android.aab
          rm -f android/app/mboteroom-release.jks

      - name: Create release checksums
        run: sha256sum MBoteRoom-Android.apk MBoteRoom-Android.aab > MBoteRoom-Android.sha256

      - name: Upload signed APK artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: mboteroom-android-release
          path: |
            MBoteRoom-Android.apk
            MBoteRoom-Android.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Upload Play Store bundle
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: mboteroom-android-play-bundle
          path: MBoteRoom-Android.aab
          if-no-files-found: error
          retention-days: 30

      - name: Publish stable Android download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="APK Android signé en mode release depuis la branche main. Commit: ${GITHUB_SHA}. Le fichier AAB est également généré pour Google Play."
          if gh release view android-latest >/dev/null 2>&1; then
            gh release upload android-latest MBoteRoom-Android.apk MBoteRoom-Android.aab MBoteRoom-Android.sha256 --clobber
            gh release edit android-latest               --title "MBotéRoom Android — dernière version signée"               --notes "$NOTES"
          else
            gh release create android-latest MBoteRoom-Android.apk MBoteRoom-Android.aab MBoteRoom-Android.sha256               --target "${GITHUB_SHA}"               --title "MBotéRoom Android — dernière version signée"               --notes "$NOTES"
          fi

      - name: Verify stable Android latest download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LOCAL_SHA="$(sha256sum MBoteRoom-Android.apk | awk '{print $1}')"
          RELEASE_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/android-latest")"
          RELEASE_BODY="$(printf '%s' "$RELEASE_JSON" | jq -r '.body // ""')"
          APK_URL="$(printf '%s' "$RELEASE_JSON" | jq -r '.assets[] | select(.name=="MBoteRoom-Android.apk") | .browser_download_url')"
          REMOTE_DIGEST="$(printf '%s' "$RELEASE_JSON" | jq -r '.assets[] | select(.name=="MBoteRoom-Android.apk") | .digest // empty')"
          EXPECTED_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/android-latest/MBoteRoom-Android.apk"

          printf '%s' "$RELEASE_BODY" | grep -F "Commit: ${GITHUB_SHA}" >/dev/null || {
            echo "::error::La release android-latest ne référence pas le commit courant ${GITHUB_SHA}."
            exit 1
          }

          test "$APK_URL" = "$EXPECTED_URL" || {
            echo "::error::Le lien APK stable ne correspond pas au lien utilisé par la page login."
            exit 1
          }

          if [ -n "$REMOTE_DIGEST" ]; then
            test "$REMOTE_DIGEST" = "sha256:${LOCAL_SHA}" || {
              echo "::error::L'APK android-latest ne correspond pas au build courant."
              exit 1
            }
          else
            ASSET_ID="$(printf '%s' "$RELEASE_JSON" | jq -r '.assets[] | select(.name=="MBoteRoom-Android.apk") | .id')"
            test -n "$ASSET_ID" && test "$ASSET_ID" != "null"
            gh api -H "Accept: application/octet-stream" "repos/${GITHUB_REPOSITORY}/releases/assets/${ASSET_ID}" > /tmp/MBoteRoom-Android.apk
            DOWNLOADED_SHA="$(sha256sum /tmp/MBoteRoom-Android.apk | awk '{print $1}')"
            test "$DOWNLOADED_SHA" = "$LOCAL_SHA" || {
              echo "::error::Le fichier téléchargé par android-latest ne correspond pas au build courant."
              exit 1
            }
          fi

          echo "APK stable vérifié pour le commit ${GITHUB_SHA}: ${APK_URL}"
