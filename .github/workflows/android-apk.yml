name: Android APK

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - "codex/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build MBotéRoom QA APK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build QA APK
        run: gradle -p android :app:assembleDebug --no-daemon --stacktrace
        env:
          MBOTEROOM_APP_URL: https://mboteroom.loukatech.com

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mboteroom-qa-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
