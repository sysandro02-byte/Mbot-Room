name: Refresh pg-mem lock

on:
  push:
    branches: [codex/render-pgmem-fallback]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: codex/render-pgmem-fallback
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Add lightweight Postgres test engine
        run: npm install @tinbase/pg-mem@3.5.0 --save
      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No lockfile changes"
          else
            git commit -m "deps: add lightweight pg-mem test fallback"
            git push origin HEAD:codex/render-pgmem-fallback
          fi
